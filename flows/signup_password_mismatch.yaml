appId: com.wdiodemoapp
name: Sign up - mismatched passwords are rejected
tags: [signup, negative]
---
- runFlow: ../helpers/open_signup.yaml
- tapOn: "input-email"
- inputText: "udamila87@gmail.com"
- tapOn: "input-password"
- inputText: "Test12345"
- tapOn: "input-repeat-password"
- inputText: "Test54321"
- hideKeyboard
- tapOn: "button-SIGN UP"
- assertVisible: "Please enter the same password"
